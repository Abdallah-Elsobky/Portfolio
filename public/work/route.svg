<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRoute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140826" />
      <stop offset="50%" stop-color="#1b1035" />
      <stop offset="100%" stop-color="#080312" />
    </linearGradient>
    <linearGradient id="routeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <pattern id="gridRoute" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="glowRoute" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradRoute)" rx="24" />
  <rect width="800" height="500" fill="url(#gridRoute)" rx="24" />

  <!-- Ambient Glows -->
  <circle cx="680" cy="140" r="160" fill="#7928ca" opacity="0.25" filter="url(#glowRoute)" />
  <circle cx="150" cy="380" r="150" fill="#ff007a" opacity="0.15" filter="url(#glowRoute)" />

  <!-- Top Badge -->
  <rect x="50" y="45" width="195" height="36" rx="18" fill="rgba(255, 0, 122, 0.12)" stroke="rgba(255, 0, 122, 0.35)" stroke-width="1.5" />
  <circle cx="70" cy="63" r="5" fill="#ff007a" />
  <text x="86" y="68" fill="#ff4d94" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">ROUTE ACADEMY</text>

  <!-- Title & Subtitle -->
  <text x="50" y="130" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Android Engineering Track</text>
  <text x="50" y="165" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Native Android • Kotlin • Architecture &amp; UI</text>

  <!-- Right Showcase -->
  <g transform="translate(440, 95)">
    <!-- Main Device Card -->
    <rect width="310" height="345" rx="20" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Inner Screen -->
    <rect x="14" y="14" width="282" height="317" rx="14" fill="#0c0618" stroke="rgba(121, 40, 202, 0.3)" stroke-width="1" />
    
    <!-- Code / Project Mockup inside -->
    <rect x="25" y="30" width="120" height="12" rx="6" fill="rgba(255, 0, 122, 0.25)" />
    <circle cx="270" cy="36" r="5" fill="#00f2fe" />
    <circle cx="254" cy="36" r="5" fill="#ff007a" />

    <!-- Feature Mini Cards -->
    <g transform="translate(25, 60)">
      <rect width="232" height="60" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
      <circle cx="30" cy="30" r="14" fill="rgba(255, 0, 122, 0.2)" />
      <text x="30" y="35" fill="#ff4d94" font-size="14" font-weight="800" text-anchor="middle">K</text>
      <text x="55" y="27" fill="#ffffff" font-size="13" font-weight="700">Kotlin &amp; Java Fundamentals</text>
      <text x="55" y="44" fill="#a855f7" font-size="11">OOP • Concurrency • Clean Code</text>
    </g>

    <g transform="translate(25, 130)">
      <rect width="232" height="60" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
      <circle cx="30" cy="30" r="14" fill="rgba(0, 242, 254, 0.2)" />
      <text x="30" y="35" fill="#00f2fe" font-size="14" font-weight="800" text-anchor="middle">⚡</text>
      <text x="55" y="27" fill="#ffffff" font-size="13" font-weight="700">Clean Architecture &amp; MVVM</text>
      <text x="55" y="44" fill="#38bdf8" font-size="11">Coroutines • Flow • Room DB</text>
    </g>

    <g transform="translate(25, 200)">
      <rect width="232" height="60" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
      <circle cx="30" cy="30" r="14" fill="rgba(168, 85, 247, 0.2)" />
      <text x="30" y="35" fill="#c084fc" font-size="14" font-weight="800" text-anchor="middle">📱</text>
      <text x="55" y="27" fill="#ffffff" font-size="13" font-weight="700">Hands-on Apps</text>
      <text x="55" y="44" fill="#e879f9" font-size="11">News • Quran • To-Do Apps</text>
    </g>

    <!-- Bottom Tag -->
    <rect x="25" y="275" width="232" height="34" rx="8" fill="url(#routeAccent)" opacity="0.85" />
    <text x="141" y="297" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Route Academy Certified</text>
  </g>

  <!-- Left Feature Pillars -->
  <g transform="translate(50, 220)">
    <rect width="340" height="70" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="35" cy="35" r="18" fill="rgba(255, 0, 122, 0.15)" />
    <path d="M 28 35 L 33 40 L 42 30" fill="none" stroke="#ff007a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Native Core Mastery</text>
    <text x="68" y="51" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12">Lifecycle, ViewModels, Navigation Component</text>
  </g>

  <g transform="translate(50, 305)">
    <rect width="340" height="70" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="35" cy="35" r="18" fill="rgba(0, 242, 254, 0.15)" />
    <path d="M 28 35 L 33 40 L 42 30" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">REST APIs &amp; Retrofit</text>
    <text x="68" y="51" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12">JSON parsing, Offline caching &amp; Error handling</text>
  </g>

  <g transform="translate(50, 390)">
    <rect width="340" height="70" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="35" cy="35" r="18" fill="rgba(168, 85, 247, 0.15)" />
    <path d="M 28 35 L 33 40 L 42 30" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="31" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Project-Based Portfolio</text>
    <text x="68" y="51" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12">End-to-end production ready applications</text>
  </g>
</svg>
