<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navPathGrad" x1="8" y1="38" x2="38" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
    <linearGradient id="navArrowGrad" x1="20" y1="6" x2="42" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#3DDC84"/>
