<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pagingCardGrad1" x1="12" y1="8" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#078D46"/>
    </linearGradient>
    <linearGradient id="pagingCardGrad2" x1="8" y1="14" x2="34" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>

  <!-- Paged Data Chunk 1 (Bottom Card Layer) -->
  <rect x="16" y="6" width="24" height="24" rx="4" fill="#3DDC84" opacity="0.3"/>

  <!-- Paged Data Chunk 2 (Middle Card Layer) -->
  <rect x="11" y="11" width="26" height="26" rx="4" fill="url(#pagingCardGrad1)" stroke="#55E897" stroke-width="1.5"/>
  
  <!-- Content Lines in Middle Card -->
  <rect x="15" y="16" width="10" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.9"/>
  <rect x="15" y="21" width="18" height="2" rx="1" fill="#FFFFFF" opacity="0.7"/>

  <!-- Paged Data Chunk 3 (Front Top Card / Active Paging Chunk) -->
  <rect x="6" y="16" width="28" height="26" rx="4" fill="url(#pagingCardGrad2)" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Chunk Header & Rows -->
  <rect x="11" y="21" width="12" height="3" rx="1.5" fill="#FFFFFF"/>
  <rect x="11" y="27" width="18" height="2" rx="1" fill="#E0F2FE"/>
  <rect x="11" y="32" width="14" height="2" rx="1" fill="#E0F2FE"/>

  <!-- Progressive Paging 3 Infinite Scroll Stream Indicator -->
  <g transform="translate(26, 30)">
    <circle cx="0" cy="0" r="3" fill="#3DDC84" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="7" cy="0" r="3" fill="#3DDC84" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="14" cy="0" r="3" fill="#3DDC84" stroke="#FFFFFF" stroke-width="1"/>
  </g>
</svg>
